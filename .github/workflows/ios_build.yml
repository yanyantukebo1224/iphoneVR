name: iOS HMD App & PC Driver CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Moonlight App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build iOS App with xcodebuild
        run: |
          chmod +x iOS/build_ios.sh
          ./iOS/build_ios.sh

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-iOS-App
          path: |
            iOS/build/Moonlight.app
            iOS/build/Moonlight-iOS.zip

  build-pc-driver:
    name: Build PC SteamVR Driver (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC & CMake
        uses: microsoft/setup-msbuild@v2

      - name: Build C++ SteamVR Driver
        run: |
          mkdir SteamVR_Driver\build
          cd SteamVR_Driver\build
          cmake ..
          cmake --build . --config Release

      - name: Upload PC Driver Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteamVR-Driver-Windows
          path: SteamVR_Driver/driver_iphonevr/
