name: Build MoonlightHMD iOS App

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Build MoonlightHMD Simulator / Device (.app / .ipa)
        run: |
          cd iOS
          xcodebuild clean build \
            -project MoonlightHMD.xcodeproj \
            -scheme MoonlightHMD \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR=../build_output

      - name: Package .app into Zip
        run: |
          mkdir -p Payload
          cp -r build_output/Release-iphoneos/MoonlightHMD.app Payload/
          zip -r MoonlightHMD.ipa Payload
          zip -r MoonlightHMD_app.zip build_output/Release-iphoneos/MoonlightHMD.app

      - name: Upload iOS App Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MoonlightHMD-iOS-App
          path: |
            MoonlightHMD.ipa
            MoonlightHMD_app.zip